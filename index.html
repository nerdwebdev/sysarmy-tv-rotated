<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sysarmy TV</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .rotated-screen {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="rotated-screen">
    <iframe
      src="https://sysar.my/p"
      title="Sysarmy"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
